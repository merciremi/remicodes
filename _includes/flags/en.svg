{%- comment -%} 8-bit Union Jack, 15×10 pixels, shown on English pages in the language switch. One <g> per pixel column, so CSS can wave the flag column by column. {%- endcomment -%}
<svg class="flag" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 10" width="30" height="20" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
<g style="--i:0"><rect x="0" y="0" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="0" y="1" width="1" height="2" style="fill:var(--c-career)"/><rect x="0" y="3" width="1" height="1" fill="#ffffff"/><rect x="0" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="0" y="6" width="1" height="1" fill="#ffffff"/><rect x="0" y="7" width="1" height="2" style="fill:var(--c-career)"/><rect x="0" y="9" width="1" height="1" style="fill:var(--c-ruby)"/></g>
<g style="--i:1"><rect x="1" y="0" width="1" height="2" fill="#ffffff"/><rect x="1" y="2" width="1" height="1" style="fill:var(--c-career)"/><rect x="1" y="3" width="1" height="1" fill="#ffffff"/><rect x="1" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="1" y="6" width="1" height="1" fill="#ffffff"/><rect x="1" y="7" width="1" height="1" style="fill:var(--c-career)"/><rect x="1" y="8" width="1" height="2" fill="#ffffff"/></g>
<g style="--i:2"><rect x="2" y="0" width="1" height="1" style="fill:var(--c-career)"/><rect x="2" y="1" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="2" y="2" width="1" height="2" fill="#ffffff"/><rect x="2" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="2" y="6" width="1" height="2" fill="#ffffff"/><rect x="2" y="8" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="2" y="9" width="1" height="1" style="fill:var(--c-career)"/></g>
<g style="--i:3"><rect x="3" y="0" width="1" height="1" style="fill:var(--c-career)"/><rect x="3" y="1" width="1" height="1" fill="#ffffff"/><rect x="3" y="2" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="3" y="3" width="1" height="1" fill="#ffffff"/><rect x="3" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="3" y="6" width="1" height="1" fill="#ffffff"/><rect x="3" y="7" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="3" y="8" width="1" height="1" fill="#ffffff"/><rect x="3" y="9" width="1" height="1" style="fill:var(--c-career)"/></g>
<g style="--i:4"><rect x="4" y="0" width="1" height="2" style="fill:var(--c-career)"/><rect x="4" y="2" width="1" height="2" fill="#ffffff"/><rect x="4" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="4" y="6" width="1" height="2" fill="#ffffff"/><rect x="4" y="8" width="1" height="2" style="fill:var(--c-career)"/></g>
<g style="--i:5"><rect x="5" y="0" width="1" height="4" fill="#ffffff"/><rect x="5" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="5" y="6" width="1" height="4" fill="#ffffff"/></g>
<g style="--i:6"><rect x="6" y="0" width="1" height="10" style="fill:var(--c-ruby)"/></g>
<g style="--i:7"><rect x="7" y="0" width="1" height="10" style="fill:var(--c-ruby)"/></g>
<g style="--i:8"><rect x="8" y="0" width="1" height="10" style="fill:var(--c-ruby)"/></g>
<g style="--i:9"><rect x="9" y="0" width="1" height="4" fill="#ffffff"/><rect x="9" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="9" y="6" width="1" height="4" fill="#ffffff"/></g>
<g style="--i:10"><rect x="10" y="0" width="1" height="2" style="fill:var(--c-career)"/><rect x="10" y="2" width="1" height="2" fill="#ffffff"/><rect x="10" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="10" y="6" width="1" height="2" fill="#ffffff"/><rect x="10" y="8" width="1" height="2" style="fill:var(--c-career)"/></g>
<g style="--i:11"><rect x="11" y="0" width="1" height="1" style="fill:var(--c-career)"/><rect x="11" y="1" width="1" height="1" fill="#ffffff"/><rect x="11" y="2" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="11" y="3" width="1" height="1" fill="#ffffff"/><rect x="11" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="11" y="6" width="1" height="1" fill="#ffffff"/><rect x="11" y="7" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="11" y="8" width="1" height="1" fill="#ffffff"/><rect x="11" y="9" width="1" height="1" style="fill:var(--c-career)"/></g>
<g style="--i:12"><rect x="12" y="0" width="1" height="1" style="fill:var(--c-career)"/><rect x="12" y="1" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="12" y="2" width="1" height="2" fill="#ffffff"/><rect x="12" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="12" y="6" width="1" height="2" fill="#ffffff"/><rect x="12" y="8" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="12" y="9" width="1" height="1" style="fill:var(--c-career)"/></g>
<g style="--i:13"><rect x="13" y="0" width="1" height="2" fill="#ffffff"/><rect x="13" y="2" width="1" height="1" style="fill:var(--c-career)"/><rect x="13" y="3" width="1" height="1" fill="#ffffff"/><rect x="13" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="13" y="6" width="1" height="1" fill="#ffffff"/><rect x="13" y="7" width="1" height="1" style="fill:var(--c-career)"/><rect x="13" y="8" width="1" height="2" fill="#ffffff"/></g>
<g style="--i:14"><rect x="14" y="0" width="1" height="1" style="fill:var(--c-ruby)"/><rect x="14" y="1" width="1" height="2" style="fill:var(--c-career)"/><rect x="14" y="3" width="1" height="1" fill="#ffffff"/><rect x="14" y="4" width="1" height="2" style="fill:var(--c-ruby)"/><rect x="14" y="6" width="1" height="1" fill="#ffffff"/><rect x="14" y="7" width="1" height="2" style="fill:var(--c-career)"/><rect x="14" y="9" width="1" height="1" style="fill:var(--c-ruby)"/></g>
</svg>
