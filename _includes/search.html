{%- assign lang = page.lang | default: "en" -%}
{%- assign t = site.data.i18n[lang] -%}
{%- if lang == "en" -%}
  {%- assign index_url = "/search.json" -%}
{%- else -%}
  {%- assign index_url = "/" | append: lang | append: "/search.json" -%}
{%- endif -%}
<div class="search"
     data-search
     data-index-url="{{ index_url | relative_url }}"
     data-text-empty="{{ t.search_empty | escape }}"
     data-text-none="{{ t.search_none | escape }}"
     data-text-one="{{ t.search_one | escape }}"
     data-text-many="{{ t.search_many | escape }}">
  <label class="visually-hidden" for="search-input">{{ t.search_label }}</label>
  <input type="search"
         id="search-input"
         class="search__input"
         placeholder="{{ t.search_placeholder | escape }}"
         autocomplete="off"
         spellcheck="false"
         role="combobox"
         aria-autocomplete="list"
         aria-expanded="false"
         aria-controls="search-results">
  <ul id="search-results" class="search__results" role="listbox" aria-label="{{ t.search_results_label | escape }}" hidden></ul>
  <p class="visually-hidden" aria-live="polite" data-search-status></p>
</div>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
