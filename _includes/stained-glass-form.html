{%- assign field_id = include.id | default: "stained-glass" -%}
<section class="newsletter newsletter--stained-glass">
  <div class="newsletter__text stack">
    <p class="t-h2">Join +50 nerds from around the world and follow this crazy project of mine. 💎</p>
    <p class="">Each week, I share my progress on the project, all of my questions about glass, electronics, pricing...</p>
  </div>
  <form action="https://remimercier.us18.list-manage.com/subscribe/post?u=73774ffb65bb733533be2d97e&amp;id=0ae611543f&amp;f_id=0062aee6f0"
        method="post"
        id="mc-embedded-subscribe-form-{{ field_id }}"
        name="mc-embedded-subscribe-form"
        class="validate"
        target="_blank"
        rel="noopener"
        novalidate>
    <label class="visually-hidden" for="mce-EMAIL-{{ field_id }}">Email address</label>
    <input type="email" value="" name="EMAIL" placeholder="Your email address" class="required email" id="mce-EMAIL-{{ field_id }}" autocomplete="email" required>
    <input type="hidden" name="tags" value="3132062">
    <!-- real people should not fill this in and expect good things - do not remove this or risk form bot signups-->
    <div class="honeypot" aria-hidden="true"><input type="text" name="b_73774ffb65bb733533be2d97e_0ae611543f" tabindex="-1" value=""></div>
    <button type="submit" name="subscribe" id="mc-embedded-subscribe-{{ field_id }}">Follow along</button>
  </form>
</section>
