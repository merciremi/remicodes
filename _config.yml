title: Rémi Mercier
email: hello@remimercier.com
description: >-
  Rémi Mercier – Freelance Ruby on Rails Developer
baseurl: ""
url: "https://remimercier.com"
twitter_username: mercier_remi
github_username: merciremi
author: Rémi Mercier

# Every post tag with a topic page. A post's first tag is its primary one: it sets
# the colour, the topic, previous/next links and related posts.
# `order: oldest` lists a topic in reading order (for series-like topics).
# NB: intentionally not named "tags" — Jekyll reserves site.tags for its own
# auto-generated post taxonomy hash.
topics:
  - { slug: minitest,    name: Minitest }
  - { slug: ruby,        name: Ruby }
  - { slug: ruby-stained-glass, name: Ruby Stained Glass, order: oldest }
  - { slug: rails,       name: Rails }
  - { slug: testing,     name: Testing }
  - { slug: rspec,       name: RSpec }
  - { slug: debugging,   name: Debugging }
  - { slug: career,      name: Career }
  - { slug: postgresql,  name: PostgreSQL }
  - { slug: git,         name: Git }
  - { slug: freelancing, name: Freelancing }
  - { slug: delivery,    name: Delivery }
  - { slug: community,   name: Community }
  - { slug: marketing,   name: Marketing }

# Rough notes and works in progress. Same layout as posts, indexed at /notes/.
# Default URL is a timestamp from the front matter `date` (e.g. /notes/202602181430/);
# set `permalink` in front matter to override.
collections:
  notes:
    output: true
    permalink: /notes/:year:month:day:hour:minute/
  # Raw Markdown copies, generated at build time by _plugins/markdown_copies.rb.
  # No _markdown/ folder: the documents only exist in memory.
  markdown:
    output: true

# Which documents get a Markdown copy in the `markdown` collection.
# Add `pages` to the list to copy Markdown pages too.
markdown_copies:
  sources: [posts]
  # Ends the attribution footer: "Written by Rémi Mercier (…/about/), <author_bio>."
  author_bio: independent Ruby on Rails developer and technical writer

defaults:
  # Fallback og:image / twitter:image for jekyll-seo-tag.
  - scope:
      path: ""
    values:
      image: /assets/media/remi-mercier.jpg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      toc: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "notes"
    values:
      layout: post
      toc: false

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-toc

feed:
  posts_limit: 100
  excerpt_only: true

toc:
  min_level: 2
  max_level: 2
  ordered_list: true

# Front matter added by `jekyll draft`. Fill in or delete
# `image` before publishing: left empty, it overrides the site-wide fallback.
jekyll_compose:
  default_front_matter:
    drafts:
      image:
        path:
        alt:

exclude:
  - Gemfile
  - Gemfile.lock
  - MIGRATION.md
  - spec
  - designs
  - vendor
  - node_modules
